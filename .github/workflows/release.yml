name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../jetti-${{ matrix.target }}.tar.gz jetti
          cd ../../..

      - uses: actions/upload-artifact@v4
        with:
          name: jetti-${{ matrix.target }}
          path: jetti-${{ matrix.target }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: jetti-*.tar.gz

  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish (skip if already published)
        run: |
          output=$(cargo publish 2>&1) && exit 0
          if echo "$output" | grep -q 'already uploaded'; then
            echo "Version already published — skipping."
          else
            echo "$output"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  tap:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Bump formula in rapidity-rs/homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/rapidity-rs/jetti/releases/download/v${VERSION}"

          tmp="$(mktemp -d)"
          declare -A SHA
          for target in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-unknown-linux-gnu \
            x86_64-unknown-linux-gnu; do
            curl -fsSL "${BASE}/jetti-${target}.tar.gz" -o "${tmp}/${target}.tar.gz"
            SHA[$target]="$(sha256sum "${tmp}/${target}.tar.gz" | cut -d' ' -f1)"
          done

          git clone "https://x-access-token:${GH_TOKEN}@github.com/rapidity-rs/homebrew-tap.git" "${tmp}/tap"
          mkdir -p "${tmp}/tap/Formula"
          cat > "${tmp}/tap/Formula/jetti.rb" <<EOF
          class Jetti < Formula
            desc "Fast, cross-platform tool for organizing git repositories"
            homepage "https://github.com/rapidity-rs/jetti"
            license "MIT"

            on_macos do
              on_arm do
                url "${BASE}/jetti-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA[aarch64-apple-darwin]}"
              end
              on_intel do
                url "${BASE}/jetti-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA[x86_64-apple-darwin]}"
              end
            end

            on_linux do
              on_arm do
                url "${BASE}/jetti-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA[aarch64-unknown-linux-gnu]}"
              end
              on_intel do
                url "${BASE}/jetti-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA[x86_64-unknown-linux-gnu]}"
              end
            end

            def install
              bin.install "jetti"
              generate_completions_from_executable(bin/"jetti", "completions", shells: [:bash, :zsh, :fish])
            end

            test do
              assert_match "jetti #{version}", shell_output("#{bin}/jetti --version")
            end
          end
          EOF

          cd "${tmp}/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/jetti.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date."
            exit 0
          fi
          git commit -m "chore: bump jetti to ${VERSION}"
          git push
